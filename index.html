<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#13151f;--bg2:#191c29;--bg3:#20232f;--text:#e8eaf0;--sub:#8b8fa8;--sub2:#5c6079;--accent:#f68b2f;--accent2:#ffb357;--border:#2a2e3f;--up:#4caf7d;--down:#e0637a;--blue:#4a9fd4;--radius:16px;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased;}
.topbar{position:fixed;top:0;left:0;right:0;height:64px;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;background:rgba(19,21,31,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);gap:16px;}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:15px;white-space:nowrap;}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);}
.brand .btw{color:var(--sub2);font-weight:500;font-size:11.5px;}
.dots{display:flex;gap:8px;flex-wrap:wrap;max-width:420px;justify-content:center;}
.dots button{width:8px;height:8px;border-radius:50%;border:none;background:var(--border);cursor:pointer;transition:all .25s;padding:0;}
.dots button.active{background:var(--accent);width:22px;border-radius:4px;}
.toggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;visibility:hidden;opacity:0;transition:opacity .2s;}
.toggle.visible{visibility:visible;opacity:1;}
.toggle button{border:none;background:transparent;color:var(--sub);font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;}
.toggle button.active{background:var(--accent);color:#1a1305;}
.deck{position:relative;width:100vw;height:100vh;}
.slide{position:absolute;inset:0;padding:96px 72px 64px;opacity:0;pointer-events:none;transform:translateY(14px);transition:opacity .45s ease,transform .45s ease;display:flex;flex-direction:column;overflow-y:auto;}
.slide.active{opacity:1;pointer-events:auto;transform:none;}
.slide-head{margin-bottom:22px;}
.eyebrow{color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;}
h1.slide-title{font-size:32px;font-weight:800;letter-spacing:-.01em;}
.slide-sub{color:var(--sub);font-size:14.5px;margin-top:6px;max-width:820px;line-height:1.5;}
.navhint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;color:var(--sub2);font-size:12px;}
.navarrow{position:fixed;top:50%;transform:translateY(-50%);z-index:100;width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:rgba(255,255,255,.03);color:var(--sub);cursor:pointer;font-size:18px;}
.navarrow:hover{background:var(--accent);color:#1a1305;border-color:var(--accent);}
#navPrev{left:14px;}#navNext{right:14px;}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;}
.kpi-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:22px;}
.kpi-label{color:var(--sub);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;}
.kpi-value{font-size:32px;font-weight:800;margin-top:8px;}
.kpi-foot{color:var(--sub2);font-size:12px;margin-top:8px;line-height:1.5;}
.up{color:var(--up);} .down{color:var(--down);}
.note{color:var(--sub2);font-size:11.5px;margin-top:14px;line-height:1.6;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:22px;}
.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{text-align:left;color:var(--sub);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:0 10px 9px;border-bottom:1px solid var(--border);white-space:nowrap;}
th.num,td.num{text-align:right;}
tbody td{padding:9px 10px;border-bottom:1px solid var(--border);}
tbody tr:last-child td{border-bottom:none;}
table.compact{font-size:12px;} table.compact th{font-size:10px;padding:0 6px 8px;white-space:normal;vertical-align:bottom;} table.compact td{padding:7px 6px;}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;margin-left:6px;text-transform:uppercase;letter-spacing:.03em;vertical-align:middle;}
.b-new{background:rgba(76,175,125,.15);color:var(--up);} .b-gone{background:rgba(224,99,122,.15);color:var(--down);}
.b-out{background:rgba(139,143,168,.15);color:var(--sub);} .b-est{background:rgba(246,139,47,.14);color:var(--accent2);}
.b-feit{background:rgba(74,159,212,.15);color:var(--blue);}
.kern-row{grid-template-columns:130px 1fr 1fr 90px !important;}
.bar-row{display:grid;grid-template-columns:160px 1fr 110px 70px;align-items:center;gap:14px;padding:8px 0;}
.track{height:26px;background:var(--bg3);border-radius:7px;overflow:hidden;}
.fill{height:100%;width:0;border-radius:7px;transition:width 1s cubic-bezier(.2,.8,.2,1);}
.amt{text-align:right;font-weight:700;font-size:14px;} .pc{text-align:right;color:var(--sub);font-size:12.5px;}
.lbl{font-size:13px;font-weight:600;color:var(--sub);}
.zone-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}
.zone-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;}
.zone-omzet{font-size:18px;font-weight:800;margin-top:6px;}
.mini-track{height:6px;background:var(--bg3);border-radius:4px;margin-top:8px;overflow:hidden;}
.mini-fill{height:100%;width:0;border-radius:4px;background:var(--accent);transition:width 1s ease;}
.meta{color:var(--sub2);font-size:11px;margin-top:8px;line-height:1.55;}
.kans-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.kans-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column;}
.kans-nr{font-size:12px;font-weight:800;color:var(--accent2);}
.kans-name{font-weight:700;font-size:15px;margin-top:2px;}
.kans-sub{color:var(--sub);font-size:12px;margin-top:2px;}
.score{display:inline-block;margin-top:10px;font-size:12px;font-weight:800;background:rgba(246,139,47,.14);color:var(--accent2);padding:3px 10px;border-radius:999px;width:max-content;}
.kv{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:7px;} .kv b{color:var(--text);}
.story{font-size:12px;line-height:1.55;color:var(--text);margin-top:12px;padding-top:10px;border-top:1px solid var(--border);}
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;}
.ring-val{font-size:28px;font-weight:800;} .ring-label{color:var(--sub);font-size:13px;}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.maps figure{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
.maps img{width:100%;display:block;}
.maps figcaption{font-size:12px;color:var(--sub);padding:8px 12px;}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg3);color:var(--sub);margin:3px 4px 0 0;}
.list-col h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--sub);margin-bottom:10px;}
.concl{display:flex;flex-direction:column;gap:12px;}
.concl-item{background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:14px;padding:14px 18px;}
.concl-title{font-weight:800;font-size:15.5px;margin-bottom:8px;}
.concl-row{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:12.8px;line-height:1.5;margin-top:4px;}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:3px 8px;border-radius:6px;height:max-content;text-align:center;}
.t-feit{background:rgba(74,159,212,.16);color:var(--blue);} .t-int{background:rgba(139,143,168,.16);color:var(--sub);}
.t-hyp{background:rgba(246,139,47,.14);color:var(--accent2);} .t-ond{background:rgba(224,99,122,.13);color:var(--down);} .t-act{background:rgba(76,175,125,.15);color:var(--up);}
.intro{justify-content:center;}
.intro-title{font-size:54px;font-weight:800;letter-spacing:-.02em;line-height:1.05;}
.intro-sub{color:var(--sub);font-size:16px;margin-top:12px;}
.intro-meta{margin-top:26px;display:flex;gap:30px;flex-wrap:wrap;}
.intro-meta div{font-size:11.5px;color:var(--sub2);text-transform:uppercase;letter-spacing:.08em;}
.intro-meta b{display:block;color:var(--text);font-size:14.5px;font-weight:700;text-transform:none;letter-spacing:0;margin-top:4px;}
.stars{display:inline-flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--border);border-radius:999px;padding:8px 16px;margin-top:22px;font-size:13px;color:var(--sub);}
.stars .s{color:var(--accent);font-size:17px;letter-spacing:2px;} .stars b{color:var(--text);}
.circle{position:absolute;border-radius:50%;opacity:.07;background:var(--accent);pointer-events:none;}
.leeswijzer{margin-top:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1100px;}
.leeswijzer div{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:12px;color:var(--sub);line-height:1.5;}
.leeswijzer b{color:var(--text);display:block;margin-bottom:4px;font-size:12.5px;}
#mapEl{flex:1;border-radius:var(--radius);overflow:hidden;min-height:420px;border:1px solid var(--border);}
.map-legend{position:absolute;bottom:14px;left:14px;background:rgba(25,28,41,.92);border:1px solid var(--border);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--sub);z-index:400;}
.metric-btns{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
.metric-btns button{border:1px solid var(--border);background:var(--bg2);color:var(--sub);font-family:inherit;font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;}
.metric-btns button.active{background:var(--accent);color:#1a1305;border-color:var(--accent);}
.more-btn{margin-top:10px;background:var(--bg3);border:1px solid var(--border);color:var(--sub);font-family:inherit;font-size:12px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;}
.login-gate{position:fixed;inset:0;z-index:1000;background:var(--bg);display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:40px 36px;width:340px;max-width:90vw;text-align:center;}
.login-title{font-size:18px;font-weight:800;margin:18px 0 6px;} .login-sub{color:var(--sub);font-size:13px;margin-bottom:22px;}
.login-input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:14px;text-align:center;outline:none;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;margin-top:14px;background:var(--accent);color:#1a1305;border:none;border-radius:10px;padding:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}
.login-error{color:var(--down);font-size:12.5px;margin-top:10px;min-height:16px;}
.sum-wrap{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:34px;max-width:1380px;}
.sum-card{background:rgba(25,28,41,.92);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:18px;padding:30px 34px;}
.sum-top{display:flex;justify-content:space-between;gap:16px;} .sum-name{font-size:26px;font-weight:800;} .sum-adr{color:var(--sub);font-size:13.5px;margin-top:4px;}
.sum-stars{text-align:right;color:var(--sub);font-size:12px;white-space:nowrap;} .sum-big{font-size:52px;font-weight:800;letter-spacing:-.01em;margin-top:6px;}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 30px;margin-top:22px;} .sum-val{font-size:24px;font-weight:800;margin-top:4px;}
.rank-row{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);} .rank-row:last-child{border-bottom:none;}
.rank-num{font-size:21px;font-weight:800;color:var(--accent2);} .rank-name{font-size:16px;font-weight:700;} .rank-sub{color:var(--sub);font-size:12.5px;margin-top:2px;} .rank-amt{font-size:18px;font-weight:800;text-align:right;}
.kans2-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.kans2{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px 22px;}
.kans2-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;} .kans2-score{font-size:12px;font-weight:700;color:var(--sub);background:var(--bg3);padding:3px 9px;border-radius:999px;}
.ma-pill{display:inline-block;margin:12px 0 6px;font-size:13.5px;font-weight:700;color:var(--down);background:rgba(224,99,122,.13);padding:5px 14px;border-radius:999px;}
.kans2 .kv{font-size:13px;margin-top:9px;} .kans-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;} .kans-tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(246,139,47,.14);color:var(--accent2);}
@media (max-width:900px){
 .sum-wrap,.kans2-grid{grid-template-columns:1fr;} .sum-big{font-size:36px;} .rank-row .mini-track{width:140px !important;}
 .topbar{padding:0 12px;height:56px;} .brand .btw,.dots{display:none;}
 .slide{padding:76px 16px 56px;} h1.slide-title{font-size:23px;} .intro-title{font-size:34px;}
 .two-col,.three-col,.maps{grid-template-columns:1fr;} .zone-grid{grid-template-columns:repeat(2,1fr);} .kans-grid{grid-template-columns:1fr;}
 .leeswijzer{grid-template-columns:1fr 1fr;} .bar-row{grid-template-columns:90px 1fr 80px;} .bar-row .pc{display:none;}
 .navarrow{display:none;} table{font-size:11.5px;} .tbl-wrap{overflow-x:auto;}
 .concl-row{grid-template-columns:1fr;}
 .navhint{display:none;} .brand{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;} .brand .dot{flex-shrink:0;}
 .kern-row{grid-template-columns:70px 1fr 1fr 56px !important;gap:8px;} .kern-row .amt{font-size:12px;}
}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('report-data').textContent);
const IMG_RAYON = document.getElementById('kaart-rayon').textContent.trim();
const IMG_80 = document.getElementById('kaart-80').textContent.trim();
const S = {slide:0, year:'2025', metric:'omzet', more:{}};
const ACC = D.meta.kleur;
const LOGO_SRC = 'data:image/png;base64,'+document.getElementById('logo-data').textContent.trim();
const LOGO = `<img src="${LOGO_SRC}" alt="Ambiance" style="width:72px;height:72px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:block;margin:0 auto;">`;

// ---------- formatters (Nederlandse notatie) ----------
const eur = n => (n===null||n===undefined) ? 'onbekend' : '€' + Math.round(n).toLocaleString('nl-NL');
const nr = n => (n===null||n===undefined) ? 'onbekend' : Number(n).toLocaleString('nl-NL');
const pct = (n,d=1) => (n===null||n===undefined) ? 'onbekend' : Number(n).toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d}) + '%';
const dec = (n,d=1) => (n===null||n===undefined) ? 'onbekend' : Number(n).toLocaleString('nl-NL',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn = (n,d=1) => (n>0?'+':'') + pct(n,d);
const cls = n => n>=0 ? 'up' : 'down';
const rt = (m,est) => m===null||m===undefined ? 'onbekend' : `${m} min${est?' <span class="badge b-est">geschat</span>':''}`;
const Y = () => S.year;

const SLIDES = [
 {id:'intro', r:renderIntro, btw:'(bedragen excl. btw, afgeleid 21%)'},
 {id:'kern', r:renderKern, btw:'(bedragen excl. btw, afgeleid 21%)'},
 {id:'marge', r:renderMarge, btw:'(bedragen excl. btw)'},
 {id:'funnel', r:renderFunnel, btw:'(bedragen incl. btw)'},
 {id:'online', r:renderOnline, btw:'(aantallen verkoopkansen, particulier)', tog:true},
 {id:'leads', r:renderLeads, btw:''},
 {id:'top10', r:renderTop10, btw:'(bedragen incl. btw, particulier)', tog:true},
 {id:'herkomst', r:renderHerkomst, btw:'(bedragen incl. btw, particulier)', tog:true},
 {id:'zones', r:renderZones, btw:'(bedragen incl. btw, particulier)', tog:true},
 {id:'postcode', r:renderPostcode, btw:'(bedragen incl. btw, particulier)'},
 {id:'mutaties', r:renderMutaties, btw:'(bedragen incl. btw, particulier)'},
 {id:'kans1', r:()=>renderKansen(1), btw:'(bedragen incl. btw, particulier)'},
 {id:'kans2', r:()=>renderKansen(2), btw:'(bedragen incl. btw, particulier)'},
 {id:'wit', r:renderWit, btw:'(bedragen incl. btw, particulier)'},
 {id:'rayon', r:renderRayon, btw:'(bedragen incl. btw, particulier)', tog:true},
];
const deck = document.getElementById('deck'), dots = document.getElementById('dots');
SLIDES.forEach((s,i)=>{ const el=document.createElement('section'); el.className='slide'; el.id='slide-'+i; deck.appendChild(el);
  const b=document.createElement('button'); b.setAttribute('aria-label','Slide '+(i+1)); b.onclick=()=>goTo(i); dots.appendChild(b); });
function render(){ const s=SLIDES[S.slide]; const el=document.getElementById('slide-'+S.slide); el.innerHTML=s.r(); el.scrollTop=0; animate(el);
  document.getElementById('btwLabel').textContent=s.btw; document.getElementById('yearToggle').classList.toggle('visible',!!s.tog);
 }
function goTo(i){ S.slide=Math.max(0,Math.min(SLIDES.length-1,i));
  document.querySelectorAll('.slide').forEach((el,k)=>el.classList.toggle('active',k===S.slide));
  document.querySelectorAll('#dots button').forEach((el,k)=>el.classList.toggle('active',k===S.slide)); render(); }
document.getElementById('navPrev').onclick=()=>goTo(S.slide-1);
document.getElementById('navNext').onclick=()=>goTo(S.slide+1);
document.addEventListener('keydown',e=>{ if(document.getElementById('loginGate').style.display!=='none') return; if(e.key==='ArrowRight') goTo(S.slide+1); if(e.key==='ArrowLeft') goTo(S.slide-1); });
document.querySelectorAll('#yearToggle button').forEach(b=>b.onclick=()=>{ S.year=b.dataset.y; document.querySelectorAll('#yearToggle button').forEach(x=>x.classList.toggle('active',x===b)); render(); });
function animate(el){ requestAnimationFrame(()=>{ el.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w);
  el.querySelectorAll('.ring-anim').forEach(r=>{ r.style.transition='stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)'; r.style.strokeDashoffset=r.dataset.off; }); }); }
const head=(eb,t,sub)=>`<div class="slide-head"><div class="eyebrow">${eb}</div><h1 class="slide-title">${t}</h1>${sub?`<div class="slide-sub">${sub}</div>`:''}</div>`;
window.toggleMore = k => { S.more[k]=!S.more[k]; render(); };

// ============ 1 INTRO (managementsamenvatting) ============
function renderIntro(){
  const m=D.meta, full=Math.round(m.rating);
  const stars='&#9733;'.repeat(full)+'<span style="opacity:.35">'+'&#9733;'.repeat(5-full)+'</span>';
  const card=(y,col)=>{ const o=D.omzet[y], k=D.klanten[y], mg=y==='2025'?D.marge2025.marge_pct:null, cur=y==='2025';
    return `<div class="sum-card" style="border-left-color:${col}">
     <div class="sum-top"><div><div class="sum-name" style="color:${col}">${m.vestiging} ${y}</div><div class="sum-adr">${m.adres}</div></div>
      <div class="sum-stars"><div style="color:${ACC}">${stars}</div>${dec(m.rating,1)} · ${nr(m.reviews)} reviews</div></div>
     <div class="kpi-label" style="margin-top:28px;">Omzet excl. btw</div>

   <div class="kpi-card"><div class="kpi-label">Online aanvragen</div><div class="kpi-value">${nr(L['2025'].totaal)}</div><div class="kpi-foot">2024: ${nr(L['2024'].totaal)} · <span class="${cls(D.leads_yoy)}">${sgn(D.leads_yoy)}</span> · na ontdubbeling</div></div>

// ============ 4 FUNNEL / PIJPLIJN ============

   <div class="bar-row" style="grid-template-columns:150px 1fr 110px;"><div class="lbl">Gewonnen</div><div class="track"><div class="fill" style="background:${ACC}" data-w="${(v.gewonnen_waarde/v.kansen_waarde*100).toFixed(1)}%"></div></div><div class="amt">${eur(v.gewonnen_waarde)}</div></div>
   <div class="bar-row" style="grid-template-columns:150px 1fr 110px;"><div class="lbl">Niet gewonnen</div><div class="track"><div class="fill" style="background:var(--sub2)" data-w="${(v.niet_gewonnen_waarde/v.kansen_waarde*100).toFixed(1)}%"></div></div><div class="amt">${eur(v.niet_gewonnen_waarde)}</div></div>
   <div class="kpi-grid" style="margin-top:12px;grid-template-columns:1fr 1fr 1fr;">

    <div><div class="kpi-label">Klant-winrate</div><div class="kpi-value" style="font-size:24px;">${pct(v.winrate_klant)}</div><div class="kpi-foot">${nr(v.gewonnen_klanten_gematcht)} van ${nr(v.kans_klanten)}</div></div>
    <div><div class="kpi-label">Niet gewonnen Q4</div><div class="kpi-value" style="font-size:24px;">${nr(v.q4_niet_gewonnen)}</div><div class="kpi-foot">${eur(v.q4_niet_gewonnen_waarde)} · mogelijk nog open</div></div>
   </div></div>`; };

}

     <div style="width:${w(t.niet)};background:var(--down);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#2a0e14;">${nr(t.niet)} niet gewonnen</div></div><div class="pc">${pct(t.pct)}</div></div>

   <div style="margin-top:10px;font-size:13.5px;">Scoringspercentage totaal: <b>${nr(t.gewonnen)}</b> gewonnen / <b>${nr(t.kansen)}</b> verkoopkansen = <b>${pct(t.pct)}</b></div>

// ============ 5 LEADS ============
function renderLeads(){
  const T=['Offerte','Advies','Contact','Reparatie'], a=D.leads['2024'].types, b=D.leads['2025'].types;
  const card=t=>{ const d=(b[t].aanvragen/a[t].aanvragen-1)*100; return `<div class="kpi-card"><div class="kpi-label">${t}</div>
   <div class="kpi-value">${nr(b[t].aanvragen)}</div><div class="kpi-foot">2024: ${nr(a[t].aanvragen)} · <span class="${cls(d)}">${sgn(d)}</span></div>
   <div class="kv"><span>Teruggevonden in PerfectView</span><b>${pct(b[t].matchgraad)}</b></div>
   <div class="kv"><span>Aantoonbaar gewonnen</span><b>${nr(b[t].aantoonbaar_gewonnen)}</b></div>
   <div class="meta">${t==='Reparatie' ? 'Reparaties worden niet altijd als verkoopkans vastgelegd; daarom geen conversie.' : (b[t].matchgraad<70 ? 'Matchgraad onder 70%: geen conversiepercentage, alleen aantallen.' : '')}${t==='Contact' ? ' Inclusief magazine-aanvragen; contactformulier vraagt geen postcode.' : ''}</div></div>`; };
  return head('Leadanalyse','Online aanvragen per type','CMS-aanvragen 2025 met 2024 ter vergelijking, na ontdubbeling.')+
  `<div class="kpi-grid" style="grid-template-columns:repeat(4,1fr);">${T.map(card).join('')}</div>
  <div class="card" style="margin-top:18px;font-size:13px;color:var(--sub);line-height:1.6;">
   <b style="color:var(--text)">Ontdubbeling:</b> zelfde e-mailadres en zelfde type binnen 7 dagen telt als één aanvraag. Voorbeeld: twee offerteaanvragen van hetzelfde adres op 3 en 5 maart = 1 aanvraag. Verwijderd: ${nr(D.leads['2025'].dubbel)} (2025) en ${nr(D.leads['2024'].dubbel)} (2024).<br>
   <b style="color:var(--text)">Teruggevonden:</b> e-mailadres van de aanvraag komt terug in de verkoopkansen of gewonnen orders van 2024-2025, op of na de aanvraagdatum. <b style="color:var(--text)">Aantoonbaar gewonnen</b> = aanvragen met minstens één gekoppelde gewonnen order; dit is een ondergrens.</div>
  <div class="note">Alle typen blijven onder de 70% matchgraad. Offerteaanvragen worden slechts in ${pct(D.extra.offerte_match['2025'])} van de gevallen teruggevonden: vermoedelijk wordt in PerfectView een ander e-mailadres of geen e-mailadres vastgelegd. De online bijdrage aan de omzet is daardoor niet betrouwbaar te meten.</div>`;
}
// ============ 6 HERKOMST ============
function renderHerkomst(){
  const y=Y(), o=y==='2025'?'2024':'2025';
  const rows=D.herkomst.filter(r=>r['klanten'+y]>0).sort((p,q)=>q['omzet'+y]-p['omzet'+y]);
  const show=S.more.h?rows:rows.slice(0,12), tot=rows.reduce((s,r)=>s+r['omzet'+y],0);
  return head('Geografie',`Klantherkomst ${y}`,`Postcodegebieden op particuliere omzet ${y}, met ${o} ter vergelijking. ${nr(rows.length)} postcodes met klanten.`)+
  `<div class="card tbl-wrap"><table><thead><tr><th>PC4</th><th>Gebied</th><th class="num">Reistijd</th><th class="num">Klanten ${y}</th><th class="num">Klanten ${o}</th><th class="num">Omzet ${y}</th><th class="num">Aandeel</th><th class="num">Marktaandeel ${y}</th></tr></thead><tbody>
  ${show.map(r=>`<tr><td>${r.pc4}</td><td>${r.naam}${r.rayon?'':'<span class="badge b-out">buiten rayon</span>'}${r['klanten'+o]===0?`<span class="badge ${y==='2025'?'b-new':'b-gone'}">${y==='2025'?'nieuw':'weg in 2025'}</span>`:''}</td>
   <td class="num">${rt(r.reistijd,r.geschat)}</td><td class="num">${nr(r['klanten'+y])}</td><td class="num" style="color:var(--sub)">${nr(r['klanten'+o])}</td><td class="num">${eur(r['omzet'+y])}</td><td class="num">${pct(r['omzet'+y]/tot*100)}</td>
   <td class="num">${y==='2025'?(r.ma2025===null?'onbekend':(r.ma2025>100?'&gt;100%*':pct(r.ma2025,2))):'<span style="color:var(--sub2)">zie 2025</span>'}</td></tr>`).join('')}
  </tbody></table>${rows.length>12?`<button class="more-btn" onclick="toggleMore('h')">${S.more.h?'Minder tonen':'Alle '+rows.length+' tonen'}</button>`:''}</div>
  <div class="note">Omzet = som gewonnen orders PerfectView incl. btw per postcode van het privéadres. Marktaandeel = omzet / CBS consumptieve besteding (incl. btw); bij 1 of 2 klanten kan één grote order het percentage sterk beïnvloeden.</div>`;
}
// ============ 7 ZONES ============
function renderZones(){
  const y=Y(), z=D.zones[y].filter(x=>x.zone!=='Onbekend'||x.omzet>0), max=Math.max(...z.map(x=>x.omzet));
  return head('Geografie','Hoe ver rijdt de klant?',`Particuliere omzet ${y} per reistijdzone vanaf Kanaal Noord 200. Gemiddelde reistijd per klant: ${dec(D.reistijd_gem[y])} minuten.`)+
  `<div class="zone-grid" style="grid-template-columns:repeat(${z.length},1fr);">${z.map(x=>`<div class="zone-card"><div class="lbl">${x.zone}</div><div class="zone-omzet">${eur(x.omzet)}</div>
   <div class="mini-track"><div class="mini-fill" data-w="${(x.omzet/max*100).toFixed(1)}%"></div></div>
   <div class="meta">${pct(x.pct)} van de omzet<br>${nr(x.klanten)} klanten · ${nr(x.pc4)} postcodes<br>${nr(x.leads)} online aanvragen<br>Marktaandeel rayondeel: ${x.ma_rayon===null?'n.v.t.':pct(x.ma_rayon,2)}</div></div>`).join('')}</div>
  <div class="card" style="margin-top:18px;font-size:14px;line-height:1.6;"><b>${pct(D.extra.binnen15_pct[y])}</b> van de particuliere omzet ${y} komt uit postcodes binnen 15 minuten rijden. Daarbuiten zakt het marktaandeel in het rayon sterk.</div>
  <div class="note">Reistijd: ${nr(D.meta.reistijd_model.n)} postcodes uit het aangeleverde reistijdbestand; overige postcodes geschat met ${dec(D.meta.reistijd_model.a,2)} + ${dec(D.meta.reistijd_model.b,3)} × hemelsbrede km vanaf het midden van postcode 7322 (gemiddelde afwijking ${dec(D.meta.reistijd_model.mae)} min op de bekende waarden). Marktaandeel alleen over rayonpostcodes met bekend potentieel; aanvragen alleen waar een postcode is ingevuld.</div>`;
}
// ============ 8 RAYON ============
function renderRayon(){
  const y=Y(), o=y==='2025'?'2024':'2025', r=D.rayon[y], circ=2*Math.PI*54, off=circ*(1-r.binnen_pct/100);
  const info={}; D.rayon_tabel.forEach(q=>info[q.pc4]=q); D.herkomst.forEach(q=>info[q.pc4]=Object.assign({},info[q.pc4]||{},q));
  const plaats=p=>{ const q=info[p]||{}; return q.plaats||q.naam||''; };
  const wijk=p=>{ const q=info[p]||{}; return q.naam||q.plaats||''; };
  const chip=p=>`<span class="chip">${p} <span style="color:var(--sub2)">${wijk(p)}</span></span>`;
  const buiten=r.feit_buiten_rayon.map(p=>info[p]).filter(Boolean);
  const uitleg=q=>q['klanten'+y]<=1
    ? `Eén klant met ${eur(q['omzet'+y])} aan orders. Die ene grote klant trekt deze plaats in de lijst: <b>toeval, geen vast werkgebied</b>.`
    : `${nr(q['klanten'+y])} klanten (${o}: ${nr(q['klanten'+o])}) op ${q.reistijd} minuten rijden, marktaandeel ${pct(q.ma2025,1)} tegen ${pct(D.rayon_totaal.ma2025,1)} gemiddeld in het rayon. Klanten weten Dekazon hier al te vinden: <b>kandidaat om aan het rayon toe te voegen</b> (wel een kleine basis).`;
  return head('Geografie','Rayon tegenover het gebied waar de klanten echt vandaan komen',
   `Het <b>rayon</b> is het gebied dat bij Dekazon hoort (${D.meta.rayon.length} postcodes, groene kaart). Het <b>werkgebied</b> is waar de klanten in ${y} werkelijk vandaan kwamen: de kleinste groep postcodes die samen 80% van de particuliere omzet opleveren (${r.feit_n} postcodes, rode kaart).`)+
  `<div class="two-col" style="grid-template-columns:300px 1fr;">
   <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
    <div class="ring-wrap"><svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="54" fill="none" stroke="var(--bg3)" stroke-width="14"/><circle class="ring-anim" cx="75" cy="75" r="54" fill="none" stroke="${ACC}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${circ}" stroke-dashoffset="${circ}" data-off="${off}" transform="rotate(-90 75 75)"/></svg>
    <div class="ring-val">${pct(r.binnen_pct)}</div><div class="ring-label">van de omzet komt uit het rayon</div></div>
    <div class="meta" style="text-align:center;">${pct(r.binnen_klanten_pct)} van de klanten woont in het rayon; ${eur(r.buiten_omzet)} omzet kwam van daarbuiten.</div>
   </div>
   <div style="display:flex;flex-direction:column;gap:14px;">
    <div class="card"><div class="list-col"><h3>In het rayon én in het werkgebied (${r.feit_n-buiten.length})</h3>
     <div class="meta" style="margin:0 0 6px;">Hier zit de kern van de omzet.</div>${r.feit_pc4.filter(p=>D.meta.rayon.includes(p)).map(chip).join('')}</div></div>
    <div class="card" style="border-color:rgba(246,139,47,.5);"><div class="list-col"><h3 style="color:var(--accent2)">Buiten het rayon, maar wel in het werkgebied (${buiten.length})</h3></div>
     ${buiten.map(q=>`<div style="display:grid;grid-template-columns:170px 1fr;gap:14px;padding:10px 0;border-top:1px solid var(--border);font-size:13px;line-height:1.55;">
       <div><b style="font-size:15px;color:var(--accent2)">${plaats(q.pc4)}</b><div class="meta" style="margin:2px 0 0;">postcode ${q.pc4} · ${q.reistijd} min rijden</div></div>
       <div>${uitleg(q)}</div></div>`).join('')||'<div class="meta">Geen.</div>'}</div>
    <div class="card"><div class="list-col"><h3>In het rayon, maar (nog) weinig klanten (${r.rayon_niet_in_feit.length})</h3>
     <div class="meta" style="margin:0 0 6px;">Deze postcodes horen bij Dekazon maar leveren samen minder dan 20% van de omzet. Hier liggen de witte gebieden en kansgebieden.${r.rayon_zonder_klant.length?` Zonder enige klant in ${y}: ${r.rayon_zonder_klant.map(p=>p+' '+wijk(p)).join(', ')}.`:''}</div>${r.rayon_niet_in_feit.map(chip).join('')}</div></div>
   </div>
  </div>
  <div class="maps" style="margin-top:16px;"><figure><img src="data:image/jpeg;base64,${IMG_RAYON}" alt="Kaart rayon Dekazon"><figcaption>Rayon Dekazon (groen)</figcaption></figure>
   <figure><img src="data:image/jpeg;base64,${IMG_80}" alt="Kaart 80% klanten"><figcaption>Gebied waar 80% van de klanten vandaan komt (rood)</figcaption></figure></div>`;
}
// ============ 9 POSTCODEPRESTATIE ============
function renderPostcode(){
  const uit=(ma,kl)=>ma!==null&&(ma>100||kl<3);
  const rows=[...D.rayon_tabel].sort((a,b)=>(uit(a.ma2025,a.klanten2025)-uit(b.ma2025,b.klanten2025))||((b.ma2025??-1)-(a.ma2025??-1)));
  const show=S.more.p?rows:rows.slice(0,12), t=D.rayon_totaal;
  const maCel=(ma,kl,om)=>ma===null?'onbekend':(ma>100?`<span title="omzet ${eur(om)} groter dan jaarpotentieel">&gt;100%*</span>`:pct(ma,2))+(kl>0&&kl<3?` <span style="color:var(--sub2);font-size:11px">(${kl} kl.)</span>`:'');
  return head('Postcodeprestatie','Rayonpostcodes per 1.000 huishoudens',`Alle ${t.n} rayonpostcodes, gesorteerd op marktaandeel 2025; postcodes met minder dan 3 klanten of een uitschieter boven 100% staan onderaan. Rayon totaal: marktaandeel ${pct(t.ma2025,2)} (2024: ${pct(t.ma2024,2)}), ${dec(t.kl1000_2025)} klanten per 1.000 huishoudens.`)+
  `<div class="card tbl-wrap" style="overflow-x:auto;"><table class="compact"><thead><tr><th>PC4</th><th>Gebied</th><th class="num">Reistijd</th><th class="num">Huish.</th><th class="num">Ink.index</th><th class="num">Potentieel</th><th class="num">Klanten 2025</th><th class="num">Omzet 2024</th><th class="num">Omzet 2025</th><th class="num">Klanten /1.000 hh</th><th class="num">Aanvr. /1.000 hh</th><th class="num">MA 2024</th><th class="num">MA 2025</th></tr></thead><tbody>
  ${show.map(r=>`<tr><td>${r.pc4}</td><td>${r.naam}</td><td class="num">${rt(r.reistijd,r.geschat)}</td><td class="num">${nr(r.hh)}</td><td class="num">${r.ink}</td><td class="num">${eur(r.potentieel)}</td><td class="num">${nr(r.klanten2025)}</td><td class="num" style="color:var(--sub)">${eur(r.omzet2024)}</td><td class="num"><b>${eur(r.omzet2025)}</b></td><td class="num">${dec(r.kl1000)}</td><td class="num">${dec(r.leads1000)}</td><td class="num" style="color:var(--sub)">${maCel(r.ma2024,r.klanten2024,r.omzet2024)}</td><td class="num"><b>${maCel(r.ma2025,r.klanten2025,r.omzet2025)}</b></td></tr>`).join('')}
  </tbody></table><button class="more-btn" onclick="toggleMore('p')">${S.more.p?'Minder tonen':'Alle '+rows.length+' tonen'}</button></div>
  <div class="note">Potentieel = CBS consumptieve besteding per jaar, incl. btw. Marktaandeel (MA) = particuliere omzet incl. btw / potentieel. Omzet = particuliere omzet incl. btw (gewonnen orders PerfectView). Inkomensindex: 100 = landelijk gemiddelde. Aanvragen per 1.000 hh: alleen aanvragen met postcode (contactformulier heeft geen postcode). *Boven 100%: de omzet in dat jaar is groter dan de jaarlijkse besteding van de postcode. Dat komt voor bij kleine postcodes met één grote order (7346 Hoog Soeren: 115 huishoudens, één order van ruim €58.000) of een project (7317 in 2024: de straat 7317 CE). Het potentieel is dan niet hoog, maar juist klein.</div>`;
}
// ============ 10 MUTATIES (toevoeging) ============
function renderMutaties(){
  const m=D.mutaties, c=D.cluster_7317CE, x=D.extra;
  const li=(r,k)=>`<tr><td>${r.pc4}</td><td>${r.naam}${r.rayon?'':'<span class="badge b-out">buiten rayon</span>'}</td><td class="num">${nr(r['klanten'+k])}</td><td class="num">${eur(r['omzet'+k])}</td></tr>`;
  const dl=r=>`<tr><td>${r.pc4}</td><td>${r.naam}</td><td class="num">${nr(r.klanten2024)} → ${nr(r.klanten2025)}</td><td class="num ${cls(r.delta_omzet)}">${r.delta_omzet>0?'+':''}${eur(r.delta_omzet)}</td></tr>`;
  return head('Toevoeging · postcodemutaties','Welke postcodes vielen af en welke kwamen erbij?',`${nr(m.n24)} postcodes met klanten in 2024, ${nr(m.n25)} in 2025, ${nr(m.beide)} in beide jaren. Particuliere omzet incl. btw.`)+
  `<div class="two-col">
   <div class="card tbl-wrap"><div class="list-col"><h3 style="color:var(--down)">Afgevallen in 2025 (${m.afgevallen.length})</h3></div><table><thead><tr><th>PC4</th><th>Gebied</th><th class="num">Klanten 2024</th><th class="num">Omzet 2024</th></tr></thead><tbody>${m.afgevallen.slice(0,8).map(r=>li(r,'2024')).join('')}</tbody></table>
    <div class="meta">Samen ${eur(m.af_omzet)} in 2024; ${nr(m.af_rayon)} hiervan in het rayon.${m.afgevallen.length>8?' Top 8 getoond.':''}</div></div>
   <div class="card tbl-wrap"><div class="list-col"><h3 style="color:var(--up)">Bijgekomen in 2025 (${m.bijgekomen.length})</h3></div><table><thead><tr><th>PC4</th><th>Gebied</th><th class="num">Klanten 2025</th><th class="num">Omzet 2025</th></tr></thead><tbody>${m.bijgekomen.slice(0,8).map(r=>li(r,'2025')).join('')}</tbody></table>
    <div class="meta">Samen ${eur(m.bij_omzet)} in 2025; ${nr(m.bij_rayon)} hiervan in het rayon.${m.bijgekomen.length>8?' Top 8 getoond.':''}</div></div>
  </div>
  <div class="two-col" style="margin-top:16px;">
   <div class="card tbl-wrap"><div class="list-col"><h3>Grootste stijgers (in beide jaren)</h3></div><table><tbody>${m.stijgers.slice(0,5).map(dl).join('')}</tbody></table></div>
   <div class="card tbl-wrap"><div class="list-col"><h3>Grootste dalers (in beide jaren)</h3></div><table><tbody>${m.dalers.slice(0,5).map(dl).join('')}</tbody></table>
    <div class="meta">De daling in 7317 komt vrijwel geheel uit één straatpostcode (7317 CE): ${nr(c['2024'].orders)} orders en ${eur(c['2024'].omzet)} in 2024 (${pct(x.cluster_aandeel_2024)} van de particuliere omzet), ${nr(c['2025'].orders)} orders in 2025.</div></div>
  </div>
  <div class="note">Afgevallen = postcode met minstens 1 particuliere klant in 2024 en geen in 2025; bijgekomen omgekeerd. De meeste mutaties zijn postcodes met 1 klant buiten het rayon: toevalsruis, geen trend. Toevoeging op de standaardrapportage.</div>`;
}
// ============ TOP 10 HERKOMST ============
function renderTop10(){
  const y=Y(), rows=D.herkomst.filter(r=>r['klanten'+y]>0).sort((p,q)=>q['omzet'+y]-p['omzet'+y]).slice(0,10), max=rows[0]['omzet'+y], rs=D.reis_stats[y], z=D.zones[y];
  return head('Geografie','Waar komt de particuliere klant vandaan?',`Top 10 postcodegebieden op particuliere omzet ${y}, reistijd en aandeel binnen het rayon (${D.meta.rayon.length} PC4).`)+
  `<div class="two-col" style="grid-template-columns:1.15fr 1fr;align-items:start;">
   <div class="card"><div class="kpi-label" style="margin-bottom:6px;">Top 10 postcodegebieden (particulier)</div>
    ${rows.map((r,i)=>`<div class="rank-row"><div class="rank-num">${String(i+1).padStart(2,'0')}</div>
     <div><div class="rank-name">${r.naam} <span style="color:var(--sub);font-weight:500;font-size:13px;">· ${r.pc4}</span>${r.rayon?'':'<span class="badge b-out">buiten rayon</span>'}</div>
      <div class="rank-sub">${nr(r['klanten'+y])} klanten · ${r.reistijd===null?'reistijd onbekend':r.reistijd+' min'}${r.geschat?' (geschat)':''}</div>
      <div class="mini-track" style="width:230px;"><div class="mini-fill" data-w="${(r['omzet'+y]/max*100).toFixed(1)}%"></div></div></div>
     <div class="rank-amt">${eur(r['omzet'+y])}</div></div>`).join('')}
   </div>
   <div style="display:flex;flex-direction:column;gap:18px;">
    <div class="card"><div class="kpi-label">Reistijd (particulier, per order)</div><div class="kpi-value" style="font-size:34px;">${dec(rs.gem)} min</div><div class="kpi-foot">gemiddelde · mediaan ${dec(rs.mediaan)} min</div>
     <div class="meta" style="font-size:12.5px;">${nr(rs.gemeten)} van ${nr(rs.orders)} orders hebben een gemeten reistijd${rs.geschat?`; ${nr(rs.geschat)} geschat vanaf het midden van de postcode`:''}${rs.onbekend?`; ${nr(rs.onbekend)} onbekend`:''}.</div></div>
    <div class="card"><div class="kpi-label" style="margin-bottom:8px;">Omzet per reistijdzone</div>
     ${z.filter(q=>q.omzet>0).map(q=>`<div class="bar-row" style="grid-template-columns:90px 1fr 60px;padding:5px 0;"><div class="lbl">${q.zone}</div><div class="track" style="height:16px;"><div class="fill" style="background:${ACC}" data-w="${q.pct}%"></div></div><div class="pc">${pct(q.pct)}</div></div>`).join('')}</div>
    <div class="card"><div class="kpi-label">Binnen het rayon</div><div class="kpi-value" style="font-size:34px;">${pct(D.rayon[y].binnen_pct)}</div><div class="kpi-foot">van de particuliere omzet ${y} · ${pct(D.rayon[y].binnen_klanten_pct)} van de klanten</div></div>
   </div></div>
  <div class="note">Omzet incl. btw, som gewonnen orders PerfectView per postcode van het privéadres.</div>`;
}
// ============ KANSEN (top 10, 1/2 en 2/2) ============
function renderKansen(part){
  const K=D.kansen, list=K.top10.slice(part===1?0:5,part===1?5:10), g=K.gewichten;
  const tags=r=>[r.ink>=105?'<span class="kans-tag">Boven modaal</span>':'', r.p_een>=45?'<span class="kans-tag">Stedelijk</span>':'', r.p_mk>=35?'<span class="kans-tag">Gezinnen</span>':''].join('');
  const card=r=>`<div class="kans2"><div class="kans2-top"><div><div class="kans-name">${r.naam}</div><div class="kans-sub">${r.pc4} · ${r.reistijd} min${r.geschat?' (geschat)':''}${r.plaats&&r.plaats!==r.naam?' · '+r.plaats:''}</div></div><span class="kans2-score">${dec(r.score,1)}</span></div>
   <span class="ma-pill">${pct(r.ma,2)} marktaandeel</span>
   <div class="kv"><span>Kooppotentieel</span><b>${eur(r.potentieel)}</b></div>
   <div class="kv"><span>Klanten / 100 hh</span><b>${dec(r.kl100,2)} <span style="color:var(--sub);font-weight:500">(${nr(r.klanten)} klanten)</span></b></div>
   <div class="kv"><span>Inkomensindex</span><b>${r.ink??'onbekend'}</b></div>
   <div class="kv"><span>Gezin met kinderen</span><b>${pct(r.p_mk)}</b></div>
   <div class="kv"><span>Online aanvragen / 1.000 hh</span><b>${dec(r.leadpen)}</b></div>
   <div class="kans-tags">${tags(r)}</div><div class="story">${r.verhaal}</div></div>`;
  return head(`Kansgebieden (${part}/2)`,'Top 10 postcodegebieden met groeipotentieel',`Gerangschikt op kansgebiedscore${part===1?' (legenda op de volgende slide). Plek 1 t/m 5; plek 6 t/m 10 op de volgende slide.':'. Plek 6 t/m 10.'}`)+
  `<div class="kans2-grid">${list.map(card).join('')}</div>
  ${part===2?`<div class="note"><b>Legenda kansscore (0-100):</b> nabijheid (reistijd, korter = hoger, ${pct(g.near*100,0)}), marktpotentieel incl. btw (hoger = hoger, ${pct(g.pot*100,0)}), koopkracht/inkomensindex (${pct(g.koop*100,0)}), marktaandeelruimte (lager marktaandeel = hoger, ${pct(g.ma*100,0)}), leadpenetratie (minder aanvragen per 1.000 hh = hoger, ${pct(g.leadpen*100,0)}) en offline tractie (klanten zonder online aanvraag per 1.000 hh, ${pct(g.offline*100,0)}). Percentielrang binnen ${nr(K.n_kandidaten)} kandidaten (rayon plus feitelijk gebied); geselecteerd uit ${nr(K.n_geschikt)} gebieden met marktaandeel onder 10% en minstens 500 huishoudens. Kooppotentieel = CBS consumptieve besteding per jaar. Tags: boven modaal = inkomensindex 105+, stedelijk = 45%+ eenpersoonshuishoudens, gezinnen = 35%+ gezinnen met kinderen.</div>`:`<div class="note">Verhaal per gebied is opgebouwd uit de cijfers; het is een hypothese, geen verklaring.</div>`}`;
}
// ============ 13 WITTE GEBIEDEN ============
function renderWit(){
  const w=D.witte_gebieden;
  return head('Witte gebieden','Waar zit Dekazon (bijna) niet?',`Rayonpostcodes zonder klant in 2025 of met minder dan ${dec(D.witte_drempel)} klanten per 1.000 huishoudens (de helft van de rayonmediaan).`)+
  `<div class="card tbl-wrap"><table><thead><tr><th>PC4</th><th>Gebied</th><th class="num">Reistijd</th><th class="num">Huishoudens</th><th class="num">Inkomensindex</th><th class="num">Potentieel</th><th class="num">Klanten 2024</th><th class="num">Klanten 2025</th><th class="num">Klanten/1.000 hh</th><th class="num">Aanvragen 2025</th></tr></thead><tbody>
  ${w.map(r=>`<tr><td>${r.pc4}</td><td>${r.naam}${r.plaats&&r.plaats!==r.naam?` <span style="color:var(--sub2)">(${r.plaats})</span>`:''}</td><td class="num">${rt(r.reistijd,r.geschat)}</td><td class="num">${nr(r.hh)}</td><td class="num">${r.ink}</td><td class="num">${eur(r.potentieel)}</td><td class="num">${nr(r.klanten2024)}</td><td class="num">${nr(r.klanten2025)}</td><td class="num">${dec(r.kl1000)}</td><td class="num">${nr(r.leads)}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="note">Een wit gebied is niet automatisch een kans: woningtype (huur/appartement), lokale concurrentie of een andere Ambiance-vestiging dichterbij kunnen de oorzaak zijn. Koop- en woningtypecijfers zijn niet aangeleverd en daarom niet meegenomen.</div>`;
}
document.getElementById('topLogo').src=LOGO_SRC;
goTo(0);
// ---------- wachtwoord (client-side, geen echte beveiliging) ----------
(function(){ const PW="@mbianceDekazon"; const gate=document.getElementById('loginGate'), inp=document.getElementById('loginInput'), err=document.getElementById('loginError');
  document.getElementById('loginLogo').innerHTML=LOGO;
  const tryIt=()=>{ if(inp.value===PW){ gate.style.display='none'; } else { err.textContent='Onjuist wachtwoord'; inp.value=''; inp.focus(); } };
  document.getElementById('loginBtn').onclick=tryIt; inp.addEventListener('keydown',e=>{ if(e.key==='Enter') tryIt(); }); inp.focus(); })();
window.goTo=goTo; window.S=S; window.D=D; window.render=render;
</script>
</body>
</html>
